<!doctype html><html lang="ro"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ison - test audio</title><style>body{font:18px system-ui;background:#14232e;color:#fff;padding:24px;max-width:600px;margin:auto}button{font:inherit;padding:15px;border:0;border-radius:12px;background:#d7b878;margin:6px}section{background:#253947;border-radius:16px;padding:20px}small{color:#d2dbe0}</style><h1>ISON</h1><p>Test audio cu ison stabilizat. Nu este validat ca ison bisericesc.</p><section><button id="start">Pornește</button><button id="stop" disabled>Oprește</button><p id="status">Pregătit</p><p>Voce: <span id="pitch">—</span></p><p>Ison experimental: <span id="drone">—</span></p><label>Volum <input id="volume" type="range" min="0" max=".09" step=".005" value=".02"></label></section><p><small>Permite microfonul. Folosește AirPods la volum redus. Algoritmul estimează o notă de sprijin, dar nu garantează corectitudinea muzicală.</small></p><script>
let ac,stream,an,osc,gain,timer,history=[],locked=null,proposal=null,proposalSince=0,lastVoice=0;
const el=id=>document.getElementById(id);
const names=['Do','Do♯','Re','Mi♭','Mi','Fa','Fa♯','Sol','La♭','La','Si♭','Si'];
function note(m){return names[(m%12+12)%12]+Math.floor(m/12-1)}
function detect(x,sr){let rms=Math.sqrt(x.reduce((a,v)=>a+v*v,0)/x.length);if(rms<.018)return null;let best=0,lag=0;for(let t=Math.floor(sr/550);t<Math.floor(sr/110);t++){let dot=0,a=0,b=0;for(let i=0;i<x.length-t;i+=3){let u=x[i],v=x[i+t];dot+=u*v;a+=u*u;b+=v*v}let c=dot/Math.sqrt(a*b+1e-10);if(c>best){best=c;lag=t}}return best>.85?sr/lag:null}
async function start(){try{ac=new AudioContext();await ac.resume();stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:false,autoGainControl:false}});an=ac.createAnalyser();an.fftSize=4096;ac.createMediaStreamSource(stream).connect(an);osc=ac.createOscillator();osc.type='sine';gain=ac.createGain();gain.gain.value=0;osc.connect(gain).connect(ac.destination);osc.start();el('start').disabled=true;el('stop').disabled=false;el('status').textContent='Ascult';let x=new Float32Array(an.fftSize);timer=setInterval(()=>{an.getFloatTimeDomainData(x);let f=detect(x,ac.sampleRate);if(!f){if(ac.currentTime-lastVoice>2.5)gain.gain.setTargetAtTime(0,ac.currentTime,.8);return}lastVoice=ac.currentTime;let m=Math.round(69+12*Math.log2(f/440));el('pitch').textContent=note(m);history.push(m%12);if(history.length>90)history.shift();if(history.length<24)return;let counts=Array(12).fill(0);history.forEach(v=>counts[v]++);let pc=counts.indexOf(Math.max(...counts));let confidence=counts[pc]/history.length;if(locked===null){if(confidence<.42)return;locked=pc;proposal=null;proposalSince=0;}
else if(pc!==locked&&confidence>.64){if(proposal!==pc){proposal=pc;proposalSince=ac.currentTime;}else if(ac.currentTime-proposalSince>6){locked=pc;proposal=null;proposalSince=0;}}
else{proposal=null;proposalSince=0;}
let base=48+locked;if(base>57)base-=12;
osc.frequency.setTargetAtTime(440*2**((base-69)/12),ac.currentTime,1.2);
gain.gain.setTargetAtTime(+el('volume').value,ac.currentTime,1.0);
el('drone').textContent=note(base)+' (susținere stabilizată, experimentală)';},160)}catch(e){el('status').textContent='Eroare microfon: '+e.message;stop(false)}}
function stop(reset=true){clearInterval(timer);if(stream)stream.getTracks().forEach(t=>t.stop());if(osc)try{osc.stop()}catch(e){}if(ac)ac.close();history=[];locked=null;proposal=null;proposalSince=0;lastVoice=0;el('start').disabled=false;el('stop').disabled=true;if(reset)el('status').textContent='Oprit'}
el('start').onclick=start;el('stop').onclick=()=>stop();el('volume').oninput=()=>{if(gain&&ac)gain.gain.setTargetAtTime(+el('volume').value,ac.currentTime,.1)};
</script></html>
