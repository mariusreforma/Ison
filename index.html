<!doctype html><html lang="ro"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ison - test audio</title><style>body{font:18px system-ui;background:#14232e;color:#fff;padding:24px;max-width:600px;margin:auto}button{font:inherit;padding:15px;border:0;border-radius:12px;background:#d7b878;margin:6px}section{background:#253947;border-radius:16px;padding:20px}small{color:#d2dbe0}</style><h1>ISON</h1><p>Versiunea 0.6 · Ison automat după voce</p><section><button id="start">Pornește</button><button id="stop" disabled>Oprește</button><p id="status">Pregătit</p><p>Voce: <span id="pitch">—</span></p><p>Ison: <span id="drone">—</span></p><label>Volum <input id="volume" type="range" min="0" max=".09" step=".005" value=".055"></label></section><p><small>Apasă Pornește, permite microfonul și începe să cânți. Folosește căștile la volum redus. Nota de sprijin este estimată.</small></p><script>
const el = id => document.getElementById(id);
const names = ['Do','Do♯','Re','Mi♭','Mi','Fa','Fa♯','Sol','La♭','La','Si♭','Si'];
const note = midi => names[midi % 12] + (Math.floor(midi / 12) - 1);
let active = null;

// Compare the waveform with delayed copies. Prefer the first strong peak
// to avoid interpreting an ordinary harmonic as a lower octave.
function detect(samples, rate) {
  const stride = Math.max(1, Math.round(rate / 10000));
  const count = Math.floor(samples.length / stride);
  const x = new Float32Array(count);
  let energy = 0;
  for (let i = 0; i < count; i++) {
    let sum = 0;
    for (let j = 0; j < stride; j++) sum += samples[i * stride + j];
    x[i] = sum / stride;
    energy += x[i] * x[i];
  }
  if (energy / count < 0.003 ** 2) return null;
  const hz = rate / stride;
  const maxLag = Math.min(count >> 1, Math.ceil(hz / 65));
  const minLag = Math.max(2, Math.floor(hz / 740));
  const corr = new Float32Array(maxLag + 2);
  let best = 0;
  for (let lag = minLag - 1; lag <= maxLag + 1; lag++) {
    let dot = 0, power = 0;
    for (let i = 0; i < count - maxLag - 1; i++) {
      const a = x[i], b = x[i + lag];
      dot += a * b;
      power += a * a + b * b;
    }
    corr[lag] = 2 * dot / (power + 1e-12);
    best = Math.max(best, corr[lag]);
  }
  for (let lag = minLag; lag <= maxLag; lag++) {
    const left = corr[lag-1], mid = corr[lag], right = corr[lag+1];
    if (mid >= Math.max(0.78, best * 0.94) && mid > left && mid >= right) {
      const shift = 0.5 * (left - right) / (left - 2 * mid + right);
      return hz / (lag + shift);
    }
  }
  return null;
}

function tracker() {
  let last = -Infinity, input = null, since = 0, anchor = null;
  let recent = [];
  return function update(freq, now) {
    if (now - last > 1.2) {
      anchor = null;
      recent = [];
      input = null;
    }
    if (!freq) return { pitch: null, anchor };
    if (now - last > 0.18) input = null;
    last = now;
    const pitch = Math.round(69 + 12 * Math.log2(freq / 440));
    if (pitch !== input) { input = pitch; since = now; }
    if (now - since >= 0.12) {
      const pc = pitch % 12;
      if (anchor === null) anchor = pitch;
      recent.push({ pc, now });
      recent = recent.filter(frame => now - frame.now <= 3);
      const support = recent.filter(frame => frame.pc === pc).length;
      if (now - since >= 0.75 && support >= recent.length * 0.60) anchor = pitch;
      while (anchor > 55) anchor -= 12;
      while (anchor < 44) anchor += 12;
    }
    return { pitch, anchor };
  };
}

function stop(message = 'Oprit') {
  const s = active;
  active = null;
  if (s) {
    clearInterval(s.timer);
    s.stream?.getTracks().forEach(track => track.stop());
    if (s.osc) s.osc.stop();
    if (s.ctx && s.ctx.state !== 'closed') s.ctx.close().catch(() => {});
  }
  el('start').disabled = false;
  el('stop').disabled = true;
  el('status').textContent = message;
  el('pitch').textContent = el('drone').textContent = '—';
}

async function start() {
  if (active) return;
  const s = active = {};
  el('start').disabled = true;
  el('stop').disabled = false;
  el('status').textContent = 'Se deschide microfonul…';
  try {
    s.ctx = new (window.AudioContext || window.webkitAudioContext)();
    await s.ctx.resume();
    if (active !== s) return;
    const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: false, autoGainControl: false } });
    if (active !== s) { stream.getTracks().forEach(track => track.stop()); return; }
    s.stream = stream;
    const ctx = s.ctx;
    const analyser = ctx.createAnalyser();
    analyser.fftSize = 4096;
    s.source = ctx.createMediaStreamSource(stream);
    s.source.connect(analyser);
    s.osc = ctx.createOscillator();
    s.osc.type = 'sine';
    s.gain = ctx.createGain();
    s.gain.gain.value = 0;
    s.osc.connect(s.gain).connect(ctx.destination);
    s.osc.start();
    await ctx.resume();
    if (active !== s) return;
    const update = tracker();
    const samples = new Float32Array(analyser.fftSize);
    const tick = () => {
      analyser.getFloatTimeDomainData(samples);
      const now = ctx.currentTime;
      const {pitch, anchor} = update(detect(samples, ctx.sampleRate), now);
      el('pitch').textContent = pitch === null ? '—' : note(pitch);
      if (anchor !== s.anchor) {
        if (anchor !== null) s.osc.frequency.setTargetAtTime(440 * 2 ** ((anchor - 69) / 12), now, 0.035);
        s.gain.gain.setTargetAtTime(anchor === null ? 0 : Number(el('volume').value), now, 0.045);
        s.anchor = anchor;
      }
      el('drone').textContent = anchor === null ? '—' : note(anchor);
      el('status').textContent = anchor === null ? 'Ascultă vocea…' : 'Ison activ';
    };
    tick();
    s.timer = setInterval(tick, 60);
    stream.getAudioTracks()[0].onended = () => { if (active === s) stop('Microfon deconectat'); };
  } catch (error) {
    if (active === s) stop('Eroare audio: ' + error.message);
  }
}
el('start').onclick = start;
el('stop').onclick = () => stop();
el('volume').oninput = () => {
  const s = active;
  if (s?.anchor != null) s.gain.gain.setTargetAtTime(Number(el('volume').value), s.ctx.currentTime, 0.04);
};
window.addEventListener('pagehide', () => stop());
</script></html>
